<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lüftungsrechner</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;
    background-color: #2b2b2b;
    color: white;
}

.card {
    background: #3a3a3a;
    border-radius: 15px;
    padding: 20px;
    margin: 20px 0;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: none;
    border-radius: 10px;
    background: #555;
    color: white;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 10px;
    background: #777;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #888;
}

.result {
    font-weight: bold;
    line-height: 1.8;
}

.info {
    line-height: 1.8;
}
</style>
</head>
<body>

<h1>Lüftungsrechner</h1>

<div class="card">
    <h2>Innen</h2>
    <label>Temperatur (°C)</label>
    <input id="tin" type="number" step="0.1">

    <label>Luftfeuchtigkeit (%)</label>
    <input id="rhin" type="number" step="0.1">
</div>

<div class="card">
    <h2>Außen</h2>
    <label>Temperatur (°C)</label>
    <input id="tout" type="number" step="0.1">

    <label>Luftfeuchtigkeit (%)</label>
    <input id="rhout" type="number" step="0.1">
</div>

<button onclick="calc()">Berechnen</button>

<div class="card result" id="result"></div>

<div class="card info">
    <h3>Orientierungswerte innen</h3>
    <p>< 8 g/m³ → Zu trocken</p>
    <p>8–10 g/m³ → Optimal</p>
    <p>10–12 g/m³ → Erhöht</p>
    <p>> 13 g/m³ → Kritisch</p>

    <h3>Lüften nach Außenwert</h3>
    <p>< 10 g/m³ → Gut lüftbar</p>
    <p>10-12 g/m³ → Kurz lüften</p>
    <p>> 13 g/m³ → Eher nicht</p>
</div>

<script>
function absHumidity(temp, rh) {
    return (6.112 * Math.exp((17.67 * temp) / (temp + 243.5)) * rh * 2.1674) / (273.15 + temp);
}

function calc() {
    const tin = parseFloat(document.getElementById("tin").value);
    const rhin = parseFloat(document.getElementById("rhin").value);
    const tout = parseFloat(document.getElementById("tout").value);
    const rhout = parseFloat(document.getElementById("rhout").value);

    if (isNaN(tin) || isNaN(rhin) || isNaN(tout) || isNaN(rhout)) {
        document.getElementById("result").innerHTML = "Bitte alle Werte eingeben.";
        return;
    }

    const inside = absHumidity(tin, rhin);
    const outside = absHumidity(tout, rhout);

    let status;
    let recommendation;

    // Innenstatus
    if (inside < 6) {
        status = "Zu trocken";
    } 
    else if (inside < 10) {
        status = "Optimal";
    } 
    else if (inside < 13) {
        status = "Erhöht";
    } 
    else {
        status = "Kritisch hoch";
    }

    // Lüftlogik nach Außenwert
    if (outside < 10) {
        recommendation = "✅ Lüften möglich";
    } 
    else if (outside < 12) {
        recommendation = "🟡 Kurzes Stoßlüften möglich";
    } 
    else {
        recommendation = "❌ Aktuell eher nicht lüften";
    }

    document.getElementById("result").innerHTML = `
        Absolute Feuchtigkeit innen: ${inside.toFixed(2)} g/m³<br>
        Absolute Feuchtigkeit außen: ${outside.toFixed(2)} g/m³<br><br>
        Innenstatus: ${status}<br><br>
        Empfehlung: ${recommendation}
    `;
}
</script>

</body>
</html>
